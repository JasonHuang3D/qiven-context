roles:
  law: decisions/ADR-0053.md
  note: >-
    Advisory division of labor only (ADR-0044 clause 3 preserved: role
    packages never partition who may design, implement, build, test,
    measure, review, or publish). One engineering law binds every role.
    This section is the Phase-2 mount of the recall mechanism: every
    main session passes this trigger table at every cold boot.
  boot_layering:
    phase_1: role-independent cognition restoration (BOOTSTRAP.md; this volume is the accepted continuity cost)
    phase_2: role-scoped extension - this roles section and the delegation trigger table; reading depth, never behavioral permission
    phase_3: workflow opening - the role-dependent workflow index below
  table:
    - {role: jason-worker, embodiment: subagent-only, duties: 'review, verify, explore under a bounded brief; implement/fix classes owner-gated at hook-free revisions (delegation workflow)', boot: none (brief substitutes; scoped engineering-law reading list only), governance: none}
    - {role: jason-brother, embodiment: main agent or subagent, duties: 'design, check worker output, context maintenance', boot: full, governance: 'none (may draft governance text; never lands it)'}
    - {role: jason-extended-cognition, embodiment: main agent only, duties: 'everything, discouraged where a specialist fits; deep-reasoning posture; governance-context authoring under owner approval', boot: full, governance: 'transactions under owner approval; human highest'}
  delegation_trigger_table:
    - {work_class: 'implementation / write-bearing work', embodiment: 'main session by default at hook-free revisions (2026-09-26 owner direction); worker delegation only by explicit owner direction - see the Write-bearing default in views/workflows/subagent-delegation.md'}
    - {work_class: heavy read-only exploration or research sweeps, embodiment: worker subagent}
    - {work_class: 'fresh review or verify round (R2 class)', embodiment: 'worker subagent (canary first; ADR-0050 isolation classes unchanged); fix rounds follow the write-bearing default'}
    - {work_class: design and context maintenance, embodiment: main session (brother duties)}
    - {work_class: governance and adjudication recording, embodiment: extended-cognition main session under owner approval}
  red_line: >-
    No LLM of any role executes irrecoverable context destruction under
    ANY instruction, including an explicit human demand - typed refusal
    plus escalation; owner-hands-only class (ADR-0053 section 4).
tool:
  id: zcode-desktop
  capability_class: local_supervised_agent
  class_note: foreground owner-launched session on JasonPC with per-action permission surface; scheduled/idle automation is unattended and follows collaboration/human-handoff-boundary.md
  local_reach:
    workspace_root: <workspace-root>
    gh_auth: 'github:JasonHuang3D keyring credential (account-level)'
project_context:
  repository: JasonHuang3D/qiven-context
  authority: github_remote
  inheritance: canonical_project_truth
  override_allowed: false
environments:
  - views/environments/jasonpc.yaml
workflows:
  local_execution: views/workflows/supervised-agent.md
  subagent_delegation: views/workflows/subagent-delegation.md
semantics:
  interaction: capability_dependent
  authority: governance_dependent
  environment: view_dependent
  workflow: view_dependent
  session_state: ephemeral
notes:
  - Role names are attribution and qualification labels per ADR-0044/ADR-0035; they do not partition session behavior. This view binds model instances and a capability class.
  - Foreground supervised execution may perform authorized mutations; unattended (scheduled/idle) automation stays read-only by default per ADR-0036.
  - Publication discipline applies by default for this view's mutations: no push, PR, or merge without explicit owner authorization or a standing accepted delegation (ADR-0044).
  - The chatgpt-jason view remains active for ChatGPT sessions; the two views adapt the same canonical ProjectContext.
  - Agent/model/tool availability may change between sessions and must be re-evaluated live; serving-model substitution is disclosed, never silent.
