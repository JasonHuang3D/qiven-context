  - {id: ADR-0051, file: ADR-0051.md, title: 'Adopt harness-native background execution as the default session path for long commands (hook deny -> run_in_background re-call), scope the Qiven Operator exec to survival/durable/custody classes, and rely on harness-native output persistence for oversized tool output - replacing the deny -> exec -> poll detour', status: accepted}
