    domain: 'collaboration-git-ci-worker-protocol'
    status: 'complete'
    required_sources: ['SRC-CURRENT-SESSION', 'SRC-PRIOR-SESSION-SUMMARIES', 'SRC-LIVE-GIT', 'SRC-REPO-DOCS', 'SRC-WORKER-HANDOFF', 'SRC-CI']
  - order: 2
    domain: 'foundation'
    status: 'complete'
